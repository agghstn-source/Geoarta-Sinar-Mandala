<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PT Geoarta Sinar Mandala - Peta Persebaran Pekerjaan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eef2f7;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #1a3c5e, #2a5f7a);
            color: white;
            padding: 30px 35px;
            border-radius: 16px 16px 0 0;
            text-align: center;
        }

        .header h1 {
            font-size: 30px;
            letter-spacing: 1px;
        }

        .header h1 span {
            color: #f1c40f;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
            margin-top: 6px;
        }

        .legenda {
            background: white;
            padding: 16px 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px 28px;
            border-bottom: 2px solid #e9edf2;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .legenda-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #333;
        }

        .legenda-item .dot {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .dot-topografi { background: #3498db; }
        .dot-fotogrametri { background: #27ae60; }
        .dot-batimetri { background: #e74c3c; }
        .dot-geodetik { background: #f39c12; }
        .dot-spasial { background: #8e44ad; }

        .content {
            background: white;
            border-radius: 0 0 16px 16px;
            padding: 25px 30px 35px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .tahun-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
            padding-bottom: 18px;
            border-bottom: 2px solid #f0f2f5;
        }

        .btn-tahun {
            padding: 8px 18px;
            border: 2px solid #dce1e8;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            transition: all 0.2s;
        }

        .btn-tahun:hover {
            border-color: #1a3c5e;
            color: #1a3c5e;
        }

        .btn-tahun.active {
            background: #1a3c5e;
            border-color: #1a3c5e;
            color: white;
        }

        .pekerjaan-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 30px;
            background: #f8fafc;
            padding: 18px 22px;
            border-radius: 10px;
            border-left: 5px solid #27ae60;
            margin-bottom: 20px;
        }

        .pekerjaan-detail .item {
            padding: 4px 0;
        }

        .pekerjaan-detail .label {
            font-weight: 600;
            color: #2c3e50;
            font-size: 13px;
        }

        .pekerjaan-detail .value {
            color: #1a3c5e;
            font-size: 15px;
        }

        .pekerjaan-detail .full {
            grid-column: 1 / -1;
        }

        .lokasi-section {
            margin: 18px 0 20px;
        }

        .lokasi-section h3 {
            color: #1a3c5e;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .lokasi-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .lokasi-tag {
            background: #eef3f7;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 12px;
            color: #2c3e50;
            border: 1px solid #dce4ec;
        }

        .lokasi-tag:hover {
            background: #dce4ec;
        }

        .foto-wrapper {
            margin: 20px 0 10px;
            border-radius: 12px;
            overflow: hidden;
            background: #f8f9fa;
            border: 1px solid #e9edf2;
        }

        .foto-wrapper img {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            background: #f0f2f5;
            display: block;
        }

        .foto-caption {
            padding: 12px 18px;
            background: #f8f9fa;
            font-size: 14px;
            color: #555;
            border-top: 1px solid #e9edf2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .foto-caption .status-error {
            color: #e74c3c;
            font-weight: 600;
        }

        .foto-caption .status-success {
            color: #27ae60;
            font-weight: 600;
        }

        .btn-refresh {
            padding: 8px 20px;
            background: #1a3c5e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-refresh:hover {
            background: #0f2a42;
        }

        .footer {
            margin-top: 30px;
            padding-top: 18px;
            border-top: 1px solid #e9edf2;
            text-align: center;
            font-size: 13px;
            color: #888;
        }

        @media (max-width: 700px) {
            .pekerjaan-detail {
                grid-template-columns: 1fr;
                gap: 4px;
            }
            .header { padding: 20px; }
            .content { padding: 16px; }
            .header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    // ============================================================
    // RENDER
    // ============================================================

    let tahunAktif = 2025;
    const semuaTahun = Object.keys(dataPekerjaan).map(Number).sort((a, b) => b - a);

    function renderTombolTahun() {
        const container = document.getElementById('tahunFilter');
        container.innerHTML = '';
        semuaTahun.forEach(tahun => {
            const btn = document.createElement('button');
            btn.className = 'btn-tahun' + (tahun === tahunAktif ? ' active' : '');
            btn.textContent = tahun;
            btn.dataset.tahun = tahun;
            btn.onclick = () => {
                tahunAktif = tahun;
                renderTombolTahun();
                renderPekerjaan(tahun);
            };
            container.appendChild(btn);
        });
    }

    function renderPekerjaan(tahun) {
        const data = dataPekerjaan[tahun];
        if (!data) {
            document.getElementById('pekerjaanContainer').innerHTML = '<p style="color:red;">Data tidak ditemukan</p>';
            return;
        }

        const container = document.getElementById('pekerjaanContainer');

        let html = '';

        html += `
            <div class="pekerjaan-detail">
                <div class="item"><span class="label">📅 Tahun</span><br><span class="value">${data.tahun}</span></div>
                <div class="item"><span class="label">📋 Pekerjaan</span><br><span class="value">${data.pekerjaan}</span></div>
                <div class="item"><span class="label">📂 Kategori</span><br><span class="value">${data.kategori}</span></div>
                <div class="item"><span class="label">📍 Lokasi</span><br><span class="value">${data.lokasi}</span></div>
                <div class="item full"><span class="label">🏢 Instansi</span><br><span class="value">${data.instansi}</span></div>
            </div>
        `;

        html += `
            <div class="lokasi-section">
                <h3>📍 Wilayah Pekerjaan</h3>
                <div class="lokasi-tags">
                    ${data.desa.map(d => `<span class="lokasi-tag">${d}</span>`).join('')}
                </div>
            </div>
        `;

        // ⭐ Pastikan path foto benar, gunakan encodeURIComponent untuk spasi ⭐
        const fotoPath = encodeURIComponent(data.foto);

        html += `
            <div class="foto-wrapper">
                <img 
                    id="fotoPekerjaan"
                    src="${fotoPath}" 
                    alt="Foto Pekerjaan - ${data.pekerjaan} ${data.tahun}"
                    onerror="handleFotoError(this, ${data.tahun})"
                />
                <div class="foto-caption" id="fotoCaption_${data.tahun}">
                    <span>📷 <strong>Foto Pekerjaan</strong> — ${data.pekerjaan} (${data.tahun})</span>
                    <span id="statusFoto_${data.tahun}" style="font-size:13px;">
                        <span class="status-success">✅ Foto ditemukan</span>
                    </span>
                </div>
            </div>
            <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:8px;">
                <button class="btn-refresh" onclick="refreshFoto(${data.tahun})">🔄 Coba Muat Ulang</button>
            </div>
        `;

        container.innerHTML = html;
    }

    function handleFotoError(img, tahun) {
        const data = dataPekerjaan[tahun];
        if (!data) return;

        const fotoPath = encodeURIComponent(data.foto);

        img.src = `https://via.placeholder.com/800x400/2c3e50/ffffff?text=FOTO+TIDAK+TERSEDIA+(${tahun})%0A${encodeURIComponent(data.foto)}`;
        img.alt = `Foto tidak tersedia untuk tahun ${tahun}`;

        const statusEl = document.getElementById(`statusFoto_${tahun}`);
        if (statusEl) {
            statusEl.innerHTML = `<span class="status-error">❌ Gagal memuat foto (Cek file: ${data.foto})</span>`;
        }

        const caption = document.getElementById(`fotoCaption_${tahun}`);
        if (caption) {
            const span = caption.querySelector('span:first-child');
            if (span) {
                span.innerHTML = `📷 <strong>Foto Pekerjaan</strong> — ${data.pekerjaan} (${tahun}) ⚠️ <span class="status-error">File tidak ditemukan</span>`;
            }
        }
    }

    function refreshFoto(tahun) {
        const data = dataPekerjaan[tahun];
        if (!data) return;

        const img = document.getElementById('fotoPekerjaan');
        if (img) {
            const fotoPath = encodeURIComponent(data.foto);
            img.src = fotoPath;
            img.alt = `Foto Pekerjaan - ${data.pekerjaan} ${tahun}`;
            img.onerror = () => handleFotoError(img, tahun);
        }

        const statusEl = document.getElementById(`statusFoto_${tahun}`);
        if (statusEl) {
            statusEl.innerHTML = `<span class="status-success">🔄 Memuat ulang...</span>`;
        }

        const caption = document.getElementById(`fotoCaption_${tahun}`);
        if (caption) {
            const span = caption.querySelector('span:first-child');
            if (span) {
                span.innerHTML = `📷 <strong>Foto Pekerjaan</strong> — ${data.pekerjaan} (${tahun})`;
            }
        }
    }

    renderTombolTahun();
    renderPekerjaan(tahunAktif);
