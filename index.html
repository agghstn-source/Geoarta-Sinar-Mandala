    <!-- Leaflet CSS -->

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1a365d;
            color: white;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        header h1 {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }
        header p {
            font-size: 0.85rem;
            color: #cbd5e0;
        }
        #map {
            flex: 1;
            width: 100%;
            z-index: 1;
        }
        
        /* Popup Styling */
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            padding: 5px;
        }
        .popup-card {
            width: 250px;
        }
        .popup-card h3 {
            color: #2b6cb0;
            font-size: 1rem;
            margin-bottom: 6px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 4px;
        }
        .popup-info {
            font-size: 0.85rem;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .popup-info strong {
            color: #4a5568;
        }
        .popup-img-container {
            width: 100%;
            height: 140px;
            background-color: #edf2f7;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #cbd5e0;
        }
        .popup-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .img-placeholder {
            font-size: 0.75rem;
            color: #718096;
            text-align: center;
            padding: 10px;
        }
        .badge-year {

            background-color: #3182ce;
            color: white;

            padding: 2px 6px;
