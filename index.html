    "Pengukuran BM / Kontrol Geodetik": "#8B4513",

    "Pengolahan Data Spasial": "#4ADE80"

/* =========================================================
   3. PENENTUAN KATEGORI
========================================================= */

function getCategory(pekerjaan) {

    const p = pekerjaan.toLowerCase();

    if (p.includes('topografi'))
        return "Pengukuran Topografi";

    if (
        p.includes('foto udara') ||
        p.includes('lidar') ||
        p.includes('video') ||
        p.includes('pemotretan udara') ||
        p.includes('peta foto tegak') ||
        p.includes('foto tegak')
    )
        return "Pengukuran Fotogrametri";

    if (
        p.includes('hidrografi') ||
        p.includes('batimetri') ||
        p.includes('usv')
    )
        return "Pengukuran Batimetri";

    if (
        p.includes('stake out') ||
        p.includes('stakeout') ||
        p.includes('soil test')
    )
        return "Pengukuran BM / Kontrol Geodetik";

    if (
        p.includes('lod 1') ||
        p.includes('dem')
    )
        return "Pengolahan Data Spasial";

    return "Pengukuran Topografi";
}


/* =========================================================
   4. ICON PIN
========================================================= */

function createPinIcon(color) {

    const svgHtml = `
        <svg class="pin-svg"
             width="26"
             height="38"
             viewBox="0 0 24 36"
             xmlns="http://www.w3.org/2000/svg">

            <path
                fill="${color}"
                stroke="#FFFFFF"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="
                M12 0
                C5.37 0 0 5.37 0 12
                c0 9 12 24 12 24
                s12-15 12-24
                C24 5.37 18.63 0 12 0z"/>

            <circle
                cx="12"
                cy="11"
                r="4.5"
                fill="#FFFFFF"/>
        </svg>
    `;

    return L.divIcon({

        className: 'custom-pin-icon',

        html: svgHtml,

        iconSize: [26, 38],

        iconAnchor: [13, 38],

        popupAnchor: [0, -34]
    });
}

   ID file:

   1ABCDEF123456
*/

function driveImage(fileId) {

    if (!fileId || fileId === "")
        return "";

    return `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;
}


function driveView(fileId) {

    if (!fileId || fileId === "")
